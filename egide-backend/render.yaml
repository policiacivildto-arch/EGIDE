services:
  - type: web
    name: egide-backend
    env: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn egide_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: egide-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
